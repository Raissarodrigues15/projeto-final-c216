[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Raissa Rodrigues"}
]
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi (>=0.163.1,<0.164.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy (>=2.1.8,<3.0.0)",
    "psycopg[binary] (>=3.3.9,<4.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "pydantic-settings (>=2.16.3,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.17.5,<0.18.0)"
]
