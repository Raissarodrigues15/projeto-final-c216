name: CI

on:
  push:
    branches: [main, projeto-final]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: snok/install-poetry@v1

      - name: Instalar dependências
        run: poetry install

      - name: Verificar lint
        run: poetry run ruff check .

      - name: Verificar formatação
        run: poetry run ruff format --check .

      - name: Executar testes
        run: poetry run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar código
        run: npm run check

      - name: Executar testes
        run: npm run test

      - name: Gerar build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Iniciar aplicação com Docker Compose
        run: docker compose up -d --build

      - name: Aguardar aplicação iniciar
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/health > /dev/null && curl -fsS http://localhost:5173 > /dev/null; then
              echo "Aplicação iniciada!"
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Instalar navegador do Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Executar teste E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Encerrar containers
        if: always()
        run: docker compose down -v